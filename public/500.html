<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>500 – Temporary Service Error | Remotfix</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/error-pages.css" />
  </head>
  <body>
    <main class="error-shell">
      <section class="error-card" aria-labelledby="error-heading">
        <div class="brand-row">
          <span class="brand-logo-wrap">
            <img src="/assets/brand/remotfix-logo.webp" alt="Remotfix" width="96" height="24" class="brand-logo" />
          </span>
          <span class="brand-name">REMOTFIX<span class="brand-accent">.IN</span></span>
        </div>
        <p class="error-code">HTTP 500 · Server Error</p>
        <h1 id="error-heading" class="error-title">Something went wrong on our end.</h1>
        <p class="error-copy">
          We encountered an unexpected technical error while handling your request. Please try again shortly or email our support desk directly.
        </p>
        <div class="error-actions">
          <a href="/" class="btn-primary">Return to Homepage</a>
          <a href="mailto:support@remotfix.in" class="btn-secondary">Email support@remotfix.in</a>
        </div>
        <div class="error-footer">
          Support desk: <a href="mailto:support@remotfix.in">support@remotfix.in</a>
        </div>
      </section>
    </main>
  </body>
</html>
