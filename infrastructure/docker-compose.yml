services:
  postgres:
    image: postgres:16-alpine
    container_name: remotfix-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remotfix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remotfix_pass}
      POSTGRES_DB: ${POSTGRES_DB:-remotfix_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: remotfix-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
